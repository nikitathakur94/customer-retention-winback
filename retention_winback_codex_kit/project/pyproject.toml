[project]
name = "retention-winback"
version = "0.1.0"
description = "Public-data reconstruction of retail retention and independent campaign measurement"
requires-python = ">=3.11,<3.14"
dependencies = ["duckdb>=1.4,<2", "dbt-core>=1.9,<1.11", "dbt-duckdb>=1.9,<1.10", "pandas>=2.2,<3", "pyarrow>=19", "scikit-learn>=1.6,<2", "statsmodels>=0.14,<1", "streamlit>=1.45,<2", "plotly>=6,<7", "kagglehub>=0.3", "scikit-uplift>=0.5,<1", "pyyaml>=6", "psutil>=7", "matplotlib>=3.10", "python-pptx>=1", "reportlab>=4", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "pytest>=8", "tabulate>=0.9"]
[project.scripts]
retention = "retention.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/retention"]
[tool.pytest.ini_options]
testpaths = ["tests"]
